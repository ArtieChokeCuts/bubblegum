<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Bubblegum Death Wish by ARTIECHOKE">
  <title>Bubblegum Death Wish | ARTIECHOKE</title>
  <link rel="preload" href="assets/asset_A_matte_black_bezel_2160x3840.png" as="image">
  <link rel="preload" href="assets/asset_B_clean_gold_cassette_1520x960.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="player-shell" aria-label="Bubblegum Death Wish album player">
      <div class="player-frame" id="playerFrame">
        <img
          class="layer cassette"
          src="assets/asset_B_clean_gold_cassette_1520x960.png"
          alt=""
          width="1520"
          height="960"
          draggable="false"
        >

        <img
          class="layer spool spool-left"
          src="assets/asset_C_gold_spool_320.png"
          alt=""
          width="320"
          height="320"
          draggable="false"
        >
        <img
          class="layer spool spool-right"
          src="assets/asset_C_gold_spool_320.png"
          alt=""
          width="320"
          height="320"
          draggable="false"
        >

        <div class="metadata-panel" aria-live="polite" aria-atomic="true">
          <div class="metadata-kicker">
            <span id="trackNumber">01 / 13</span>
            <span>ARTIECHOKE</span>
          </div>
          <div class="track-title" id="trackTitle">daylight</div>
          <div class="timeline">
            <span id="currentTime">0:00</span>
            <input id="seekControl" type="range" min="0" max="1000" value="0" aria-label="Track position">
            <span id="duration">--:--</span>
          </div>
        </div>

        <img
          class="layer bezel"
          src="assets/asset_A_matte_black_bezel_2160x3840.png"
          alt="ARTIECHOKE Stereo, Bubblegum Death Wish cassette player"
          width="2160"
          height="3840"
          draggable="false"
        >

        <div class="brand-title" aria-hidden="true">ARTIECHOKE STEREO</div>

        <section class="liner-notes" id="linerNotes" aria-label="About the current track">
          <div class="liner-heading">
            <span>LINER NOTES</span>
            <span id="linerTrackNumber">TRACK 01</span>
          </div>
          <div class="liner-scroll" id="linerScroll" tabindex="0">
            <div class="liner-copy" id="linerCopy">
              <h2 id="linerTitle">daylight</h2>
              <p id="linerDescription"></p>
            </div>
          </div>
          <div class="liner-ticker" aria-hidden="true">
            <div class="liner-ticker-track">
              <span class="ticker-item"></span>
              <span class="ticker-item"></span>
            </div>
          </div>
        </section>

        <button class="control-hitbox previous-control" id="previousControl" type="button" aria-label="Previous track" title="Previous track"></button>
        <button class="control-hitbox play-control" id="playControl" type="button" aria-label="Play" title="Play"></button>
        <button class="control-hitbox stop-control" id="stopControl" type="button" aria-label="Stop" title="Stop"></button>
        <button class="control-hitbox next-control" id="nextControl" type="button" aria-label="Next track" title="Next track"></button>
        <a class="control-hitbox download-control" id="downloadControl" href="tracks/track_01.mp3" download="01_daylight.mp3" aria-label="Download current track" title="Download current track"></a>

        <audio id="audioPlayer" preload="metadata" playsinline></audio>
      </div>
    </section>
  </main>

  <noscript>JavaScript is required to operate this player.</noscript>
  <script src="app.js"></script>
</body>
</html>
